<!DOCTYPE html>
<html>
<head>
  <title>Article</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Mouse Glow -->
<div class="mouse-glow"></div>

<!-- Custom Cursor -->
<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

  <div class="article-page">
    <img id="article-image">
    <h1 id="article-title"></h1>
    <p id="article-description"></p>
    <a id="article-link" target="_blank">Read Full Article →</a>
  </div>

  <script>
    const articles = JSON.parse(localStorage.getItem("articles"));
    const index = localStorage.getItem("selectedArticle");
    const article = articles[index];

    document.getElementById("article-image").src = article.urlToImage || '';
    document.getElementById("article-title").innerText = article.title;
    document.getElementById("article-description").innerText = article.description;
    document.getElementById("article-link").href = article.url;
  </script>

</body>
</html>
